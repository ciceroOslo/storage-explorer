<title>/storage Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one scoped column. Controls on top, then the current folder:
   summary → map + who/age side panel → subfolder table → files → blind spots. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #17202b;
  --ink-2: #5a6472;
  --line: #dde2e8;
  --hover: #eef2f6;
  --sel: #17202b;
  --warn: #b25e00;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  /* age: ordinal single-hue ramp, fresh → old (validated, light surface) */
  --a0: #84b9f3; --a1: #519ced; --a2: #257de0; --a3: #1b64be; --a4: #0f4a96; --a5: #0b3670; --a6: #061f42;
  --a0-ink: #0b0b0b; --a1-ink: #0b0b0b; --a2-ink: #fff; --a3-ink: #fff; --a4-ink: #fff; --a5-ink: #fff; --a6-ink: #fff;
  /* owners: categorical, fixed order by global rank */
  --o0: #257de0; --o1: #f47230; --o2: #00b894; --o3: #f2a600; --o4: #ee7fac; --o5: #008a17; --o6: #6a4ce2; --o7: #ec4647;
  --o-other: #a3abb5;
  --o-ink: #fff; --o3-ink: #0b0b0b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1217; --surface: #161b22; --ink: #e6eaef; --ink-2: #9aa4b0; --line: #29313b; --hover: #1f2630; --sel: #e6eaef; --warn: #f0a04b;
    --a0: #1757ac; --a1: #2370cd; --a2: #338ced; --a3: #6aabf1; --a4: #9dc8f7; --a5: #cce3fd; --a6: #eef5fe;
    --a0-ink: #fff; --a1-ink: #fff; --a2-ink: #0b0b0b; --a3-ink: #0b0b0b; --a4-ink: #0b0b0b; --a5-ink: #0b0b0b; --a6-ink: #0b0b0b;
    --o0: #338ced; --o1: #e76624; --o2: #00a888; --o3: #d28e05; --o4: #e24d8b; --o5: #0aac23; --o6: #9887ef; --o7: #eb6263;
    --o-other: #5c6570;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1217; --surface: #161b22; --ink: #e6eaef; --ink-2: #9aa4b0; --line: #29313b; --hover: #1f2630; --sel: #e6eaef; --warn: #f0a04b;
  --a0: #1757ac; --a1: #2370cd; --a2: #338ced; --a3: #6aabf1; --a4: #9dc8f7; --a5: #cce3fd; --a6: #eef5fe;
  --a0-ink: #fff; --a1-ink: #fff; --a2-ink: #0b0b0b; --a3-ink: #0b0b0b; --a4-ink: #0b0b0b; --a5-ink: #0b0b0b; --a6-ink: #0b0b0b;
  --o0: #338ced; --o1: #e76624; --o2: #00a888; --o3: #d28e05; --o4: #e24d8b; --o5: #0aac23; --o6: #9887ef; --o7: #eb6263;
  --o-other: #5c6570;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
h1 code { font-family: var(--font-data); font-weight: 500; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 0; text-wrap: balance; }
.muted { color: var(--ink-2); }
.mono, code { font-family: var(--font-data); font-size: 0.92em; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl > span { font-size: 12px; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; max-width: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }

.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-family: var(--font-data); font-size: 15px; min-width: 0; }
.crumbs button { border: 0; background: none; padding: 2px 4px; border-radius: 4px; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.crumbs button:hover { background: var(--hover); }
.crumbs .here { padding: 2px 4px; font-weight: 500; }
.crumbs .sep { color: var(--ink-2); }
.copy { margin-left: 8px; font-family: var(--font-ui); font-size: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 8px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--ink-2); }
.tile .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tile .s { font-size: 12px; color: var(--ink-2); }

.fsbar { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.fsbar .bar { display: flex; height: 18px; gap: 2px; }
.fsbar .bar div { height: 100%; }
.fsbar .bar div:first-child { border-radius: 4px 0 0 4px; }
.fsbar .bar div:last-child { border-radius: 0 4px 4px 0; }
.hatch { background: repeating-linear-gradient(135deg, var(--warn) 0 2px, transparent 2px 6px); outline: 1px solid var(--warn); outline-offset: -1px; }
.free { background: var(--line); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
#map { position: relative; width: 100%; height: 480px; }
#map svg { display: block; }
#map rect { cursor: pointer; }
#map rect.own { cursor: default; }
#map text { pointer-events: none; font-family: var(--font-ui); }
.empty { color: var(--ink-2); padding: 24px; text-align: center; }

.owners { display: flex; flex-direction: column; gap: 2px; }
.orow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 64px; gap: 8px; align-items: center; padding: 3px 4px; border-radius: 4px; border: 0; background: none; text-align: left; width: 100%; }
.orow:hover { background: var(--hover); }
.orow.sel { background: var(--hover); box-shadow: inset 2px 0 0 var(--sel); }
.orow.dim { opacity: 0.45; }
.orow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.orow .nm i { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.orow .vl { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.stack { display: flex; gap: 2px; height: 14px; }
.stack div { height: 100%; min-width: 0; }
.stack div:first-child { border-top-left-radius: 3px; border-bottom-left-radius: 3px; }
.stack div:last-child { border-top-right-radius: 3px; border-bottom-right-radius: 3px; }

.agecols { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 150px; }
.agecol { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; }
.agecol .b { width: 100%; border-radius: 4px 4px 0 0; min-height: 1px; }
.agecol .t { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.agelab { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 11px; color: var(--ink-2); text-align: center; border-top: 1px solid var(--line); padding-top: 4px; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-2); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th .arrow { font-size: 10px; }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--hover); }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
td.path { font-family: var(--font-data); font-size: 12px; word-break: break-all; min-width: 240px; }
.minibar { display: flex; gap: 1px; height: 10px; width: 120px; }
.minibar div { height: 100%; }
.flag { color: var(--warn); font-size: 12px; white-space: nowrap; }
.more { align-self: flex-start; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 12px; font-size: 13px; }

.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.years { display: flex; align-items: end; gap: 2px; height: 120px; }
.years div { flex: 1; background: var(--a3); border-radius: 2px 2px 0 0; min-height: 1px; }
.years div:hover { background: var(--a5); }
.yearlab { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 4px; }
.note { font-size: 13px; color: var(--ink-2); max-width: 68ch; margin: 0; }

#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-width: 340px; }
#tip .p { font-family: var(--font-data); word-break: break-all; font-weight: 500; margin-bottom: 4px; }
#tip .row { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; }
#loading { padding: 40px; text-align: center; color: var(--ink-2); }

@media (max-width: 960px) {
  .main, .two { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  #map { height: 360px; }
  .tile .v { font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .orow, tr.click td { transition: background-color 120ms; }
}
</style>

<div class="wrap" id="app">
  <div id="loading">Loading scan data…</div>
</div>
<div id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/d3-hierarchy@3.1.2/dist/d3-hierarchy.min.js"></script>
<script>/*__DATA__*/</script>
<script>
(async function () {
  const app = document.getElementById('app');
  let D = window.__DATA__;
  if (!D) {
    try { D = await (await fetch('data.json')).json(); }
    catch (e) { app.innerHTML = '<div id="loading">Could not load data.json. If you opened this file from disk, open standalone.html instead.</div>'; return; }
  }

  // ---------- model ----------
  const N = D.nodes.length, R = D.rows, NR = R.length / 6, A = D.age_labels.length;
  const par = new Int32Array(N), depth = new Int32Array(N), kids = Array.from({ length: N }, () => []);
  for (let i = 0; i < N; i++) { par[i] = D.nodes[i][1]; if (par[i] >= 0) { kids[par[i]].push(i); depth[i] = depth[par[i]] + 1; } }
  const maxDepth = Math.max(...depth);
  const pathCache = new Array(N);
  const path = i => pathCache[i] ?? (pathCache[i] = par[i] < 0 ? D.nodes[i][0] : path(par[i]) + '/' + D.nodes[i][0]);
  const byPath = new Map(); for (let i = 0; i < N; i++) byPath.set(path(i), i);
  const OLD_OPTS = [[2, '1 year'], [3, '2 years'], [4, '3 years'], [5, '5 years'], [6, '10 years']];

  const state = { cur: 0, metric: 'm', owner: null, old: 5, color: 'age', sort: ['size', -1], nfiles: 25 };
  try { const s = JSON.parse(localStorage.getItem('storage-explorer') || '{}'); if (s.metric) state.metric = s.metric; if (s.old) state.old = s.old; if (s.color) state.color = s.color; } catch (e) {}
  const save = () => { try { localStorage.setItem('storage-explorer', JSON.stringify({ metric: state.metric, old: state.old, color: state.color })); } catch (e) {} };

  let age, files, ownAge, ownerAge;
  function compute() {
    const off = state.metric === 'a' ? 3 : 2, f = state.owner;
    age = new Float64Array(N * A); files = new Float64Array(N); ownAge = new Float64Array(N * A);
    ownerAge = Array.from({ length: N }, () => new Map());
    for (let k = 0; k < R.length; k += 6) {
      const node = R[k], u = R[k + 1], bk = R[k + off], cnt = R[k + 4], bl = R[k + 5];
      const take = f === null || f === u;
      if (take) ownAge[node * A + bk] += bl;
      for (let a = node; a >= 0; a = par[a]) {
        const m = ownerAge[a]; let arr = m.get(u); if (!arr) m.set(u, arr = new Float64Array(A)); arr[bk] += bl;
        if (take) { age[a * A + bk] += bl; files[a] += cnt; }
      }
    }
  }
  const sumA = (arr, i) => { let s = 0; for (let j = 0; j < A; j++) s += arr[i * A + j]; return s; };
  const total = i => sumA(age, i);
  const oldOf = (arr, i) => { let s = 0; for (let j = state.old; j < A; j++) s += arr[i * A + j]; return s; };
  const ageVec = (arr, i) => Array.from({ length: A }, (_, j) => arr[i * A + j]);
  function median(vec) { const t = vec.reduce((a, b) => a + b, 0); let c = 0; for (let j = 0; j < A; j++) { c += vec[j]; if (c >= t / 2) return j; } return A - 1; }
  function topOwner(i) { let best = -1, bv = -1; for (const [u, arr] of ownerAge[i]) { const s = arr.reduce((a, b) => a + b, 0); if (s > bv) { bv = s; best = u; } } return best; }

  // ---------- formatting ----------
  const fmtB = b => { const u = ['B', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB']; let i = 0; while (b >= 1024 && i < 5) { b /= 1024; i++; } return (b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)) + ' ' + u[i]; };
  const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'k' : Math.round(n).toLocaleString('en');
  const fmtD = t => t ? new Date(t * 1000).toISOString().slice(0, 10) : '–';
  const pct = (a, b) => b > 0 ? (100 * a / b).toFixed(a / b < 0.1 ? 1 : 0) + '%' : '–';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const uname = u => D.users[u] ?? '?';
  const ocol = u => u >= 0 && u < 8 ? `var(--o${u})` : 'var(--o-other)';
  const oink = u => u === 3 ? 'var(--o3-ink)' : u >= 0 && u < 8 ? 'var(--o-ink)' : 'var(--ink)';
  const metricWord = () => state.metric === 'a' ? 'accessed' : 'modified';
  const oldWord = () => OLD_OPTS.find(o => o[0] === state.old)[1];

  // ---------- tooltip ----------
  const tip = document.getElementById('tip');
  function showTip(ev, html) { tip.innerHTML = html; tip.hidden = false; moveTip(ev); }
  function moveTip(ev) { const w = tip.offsetWidth, h = tip.offsetHeight; let x = ev.clientX + 14, y = ev.clientY + 14; if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (y + h > innerHeight - 8) y = ev.clientY - h - 14; tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px'; }
  const hideTip = () => { tip.hidden = true; };
  function nodeTip(i, label) {
    const t = total(i), v = ageVec(age, i), o = topOwner(i);
    return `<div class="p">${esc(label ?? path(i))}</div>
      <div class="row"><span>Disk used</span><b>${fmtB(t)}</b></div>
      <div class="row"><span>Files</span><span>${fmtN(files[i])}</span></div>
      <div class="row"><span>Not ${metricWord()} in ${oldWord()}</span><span>${pct(oldOf(age, i), t)}</span></div>
      <div class="row"><span>Largest owner</span><span>${esc(uname(o))}</span></div>
      <div class="row"><span>Newest file modified</span><span>${fmtD(D.nodes[i][2])}</span></div>
      <div class="minibar" style="width:100%;margin-top:6px">${v.map((x, j) => x > 0 ? `<div style="flex:${x};background:var(--a${j})"></div>` : '').join('')}</div>`;
  }

  // ---------- skeleton ----------
  const fsTotal = D.statfs.blocks * D.statfs.bsize, fsFree = D.statfs.bfree * D.statfs.bsize, fsUsed = fsTotal - fsFree;
  const fullScan = D.scanned_root === D.root;
  app.innerHTML = `
    <div class="head">
      <h1>Storage Explorer <code>${esc(D.root)}</code></h1>
      <div class="muted">Scanned ${fmtD(D.scan_time)} · ${fmtN(D.files)} files · ${fmtN(D.dirs)} folders${fullScan ? '' : ` · partial scan of <code>${esc(D.scanned_root)}</code>`}</div>
    </div>
    <div class="controls" role="group" aria-label="View settings">
      <div class="ctl"><span>Age by</span><div class="seg" id="c-metric"><button data-v="m">Last modified</button><button data-v="a">Last accessed</button></div></div>
      <div class="ctl"><span>Count as old after</span><select id="c-old">${OLD_OPTS.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>
      <div class="ctl"><span>Owner</span><select id="c-owner"><option value="">All owners</option>${D.users.map((u, i) => `<option value="${i}">${esc(u)}</option>`).join('')}</select></div>
      <div class="legend" id="agelegend"></div>
    </div>
    <div id="fs"></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="tiles" id="tiles"></div>
    <div class="main">
      <div class="panel">
        <div class="panel-head"><h2 id="map-title">Subfolders by disk use</h2>
          <div class="ctl"><span>Color by</span><div class="seg" id="c-color"><button data-v="age">Median age</button><button data-v="owner">Largest owner</button></div></div></div>
        <div id="map"></div>
        <div class="legend" id="maplegend"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="panel"><div class="panel-head"><h2>Who owns it</h2><span class="muted" style="font-size:12px">Click to filter</span></div><div class="owners" id="owners"></div></div>
        <div class="panel"><h2 id="age-title">How old is it</h2><div><div class="agecols" id="agecols"></div><div class="agelab" id="agelab"></div></div></div>
      </div>
    </div>
    <div class="panel"><h2>Subfolders</h2><div class="tablewrap"><table id="kids"></table></div></div>
    <div class="panel"><h2 id="files-title">Largest files</h2><div class="tablewrap"><table id="files"></table></div><button class="more" id="files-more">Show more</button></div>
    <div class="two">
      <div class="panel"><h2>Blind spots</h2><div id="blind"></div></div>
      <div class="panel"><h2 id="years-title">Data by year</h2><div class="years" id="years"></div><div class="yearlab" id="yearlab"></div><p class="note" id="years-note"></p></div>
    </div>`;

  const $ = id => document.getElementById(id);
  function segBind(id, key, after) {
    $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state[key] = b.dataset.v; save(); after(); });
  }
  segBind('c-metric', 'metric', () => { compute(); render(); });
  segBind('c-color', 'color', () => render());
  $('c-old').addEventListener('change', e => { state.old = +e.target.value; save(); render(); });
  $('c-owner').addEventListener('change', e => { state.owner = e.target.value === '' ? null : +e.target.value; compute(); render(); });
  $('files-more').addEventListener('click', () => { state.nfiles += 50; renderFiles(); });
  function go(i) { state.cur = i; state.nfiles = 25; render(); }

  // ---------- renderers ----------
  function renderControls() {
    for (const [id, key] of [['c-metric', 'metric'], ['c-color', 'color']])
      for (const b of $(id).querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.v === state[key]);
    $('c-old').value = state.old;
    $('c-owner').value = state.owner === null ? '' : state.owner;
    $('agelegend').innerHTML = `<span>Age (${metricWord()}):</span>` + D.age_labels.map((l, j) => `<span><i style="background:var(--a${j})"></i>${l}</span>`).join('');
  }

  function renderFs() {
    if (!fullScan || state.cur !== 0) { $('fs').innerHTML = ''; return; }
    let seen = 0; for (let k = 0; k < R.length; k += 6) seen += R[k + 5];
    const gap = Math.max(0, fsUsed - seen);
    $('fs').innerHTML = `<div class="fsbar">
      <div class="panel-head"><h2>Whole filesystem</h2><span class="muted num">${fmtB(fsUsed)} used of ${fmtB(fsTotal)} · ${fmtB(fsFree)} free (${pct(fsFree, fsTotal)})</span></div>
      <div class="bar" role="img" aria-label="Scanned ${fmtB(seen)}, not visible ${fmtB(gap)}, free ${fmtB(fsFree)}">
        <div style="flex:${seen};background:var(--a3)"></div><div class="hatch" style="flex:${gap}"></div><div class="free" style="flex:${fsFree}"></div></div>
      <div class="legend"><span><i style="background:var(--a3)"></i>Seen by this scan ${fmtB(seen)}</span>
        <span><i class="hatch"></i>Not visible with your permissions ${fmtB(gap)} (${pct(gap, fsUsed)} of used)</span>
        <span><i class="free"></i>Free ${fmtB(fsFree)}</span></div></div>`;
  }

  function renderCrumbs() {
    const chain = []; for (let a = state.cur; a >= 0; a = par[a]) chain.unshift(a);
    $('crumbs').innerHTML = chain.map((a, k) => k === chain.length - 1 ? `<span class="here">${esc(D.nodes[a][0])}</span>` : `<button data-i="${a}">${esc(D.nodes[a][0])}</button><span class="sep">/</span>`).join('') +
      `<button class="copy" id="copy">Copy path</button>`;
    $('crumbs').querySelectorAll('button[data-i]').forEach(b => b.onclick = () => go(+b.dataset.i));
    $('copy').onclick = async () => { const p = path(state.cur); try { await navigator.clipboard.writeText(p); $('copy').textContent = 'Copied'; } catch (e) { $('copy').textContent = p; } setTimeout(() => { const c = $('copy'); if (c) c.textContent = 'Copy path'; }, 1500); };
  }

  function renderTiles() {
    const i = state.cur, t = total(i), o = oldOf(age, i);
    const nOwners = [...ownerAge[i].values()].filter(a => a.some(x => x > 0)).length;
    const parentT = par[i] >= 0 ? total(par[i]) : 0;
    const hidden = (() => { let h = 0; const p = path(i); for (const [d, n] of D.noexec) if (d === p || d.startsWith(p + '/')) h += n; return h; })();
    $('tiles').innerHTML = `
      <div class="tile"><span class="k">Disk used${state.owner !== null ? ' by ' + esc(uname(state.owner)) : ''}</span><span class="v">${fmtB(t)}</span><span class="s">${par[i] >= 0 ? pct(t, parentT) + ' of parent folder' : 'Everything this scan could see'}</span></div>
      <div class="tile"><span class="k">Files</span><span class="v">${fmtN(files[i])}</span><span class="s">${t && files[i] ? 'Average ' + fmtB(t / files[i]) + ' each' : '&nbsp;'}</span></div>
      <div class="tile"><span class="k">Not ${metricWord()} in ${oldWord()}</span><span class="v">${fmtB(o)}</span><span class="s">${pct(o, t)} of this folder</span></div>
      <div class="tile"><span class="k">Owners</span><span class="v">${nOwners}</span><span class="s">${hidden ? `<span class="flag">${fmtN(hidden)} entries hidden from you</span>` : 'No hidden entries'}</span></div>`;
  }

  function mapItems() {
    const i = state.cur;
    const items = kids[i].filter(k => total(k) > 0).map(k => ({ i: k, name: D.nodes[k][0], value: total(k), vec: ageVec(age, k) }));
    const own = sumA(ownAge, i);
    if (own > 0) {
      const leaf = kids[i].length === 0 && depth[i] === maxDepth;
      items.push({ i, own: true, name: leaf ? 'everything inside (deeper levels not broken down)' : 'files directly in this folder', value: own, vec: ageVec(ownAge, i) });
    }
    return items;
  }

  function renderMap() {
    const el = $('map'), items = mapItems();
    if (!window.d3) { el.innerHTML = '<div class="empty">The folder map could not load. The tables below show the same data.</div>'; $('maplegend').innerHTML = ''; return; }
    const W = el.clientWidth, H = el.clientHeight;
    $('map-title').textContent = kids[state.cur].length ? 'Subfolders by disk use' : 'This folder';
    if (!items.length) { el.innerHTML = `<div class="empty">Nothing here${state.owner !== null ? ' owned by ' + esc(uname(state.owner)) : ''}.</div>`; $('maplegend').innerHTML = ''; return; }
    const root = d3.hierarchy({ children: items }).sum(d => d.value || 0).sort((a, b) => b.value - a.value);
    d3.treemap().size([W, H]).paddingInner(2).tile(d3.treemapSquarify.ratio(1.2)).round(true)(root);
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Treemap of subfolders sized by disk use; the table below lists the same data');
    for (const leaf of root.leaves()) {
      const d = leaf.data, w = leaf.x1 - leaf.x0, h = leaf.y1 - leaf.y0; if (w < 1 || h < 1) continue;
      let fill, ink;
      if (state.color === 'age') { const m = median(d.vec); fill = `var(--a${m})`; ink = `var(--a${m}-ink)`; }
      else { const u = state.owner !== null ? state.owner : topOwner(d.i); fill = ocol(u); ink = oink(u); }
      const g = document.createElementNS(svgNS, 'g');
      const r = document.createElementNS(svgNS, 'rect');
      r.setAttribute('x', leaf.x0); r.setAttribute('y', leaf.y0); r.setAttribute('width', w); r.setAttribute('height', h); r.setAttribute('rx', 3);
      r.setAttribute('style', `fill:${fill}`); if (d.own) { r.setAttribute('class', 'own'); r.setAttribute('style', `fill:${fill};fill-opacity:0.55`); }
      r.addEventListener('mouseenter', ev => showTip(ev, d.own ? nodeTipOwn(d) : nodeTip(d.i)));
      r.addEventListener('mousemove', moveTip); r.addEventListener('mouseleave', hideTip);
      if (!d.own) r.addEventListener('click', () => { hideTip(); go(d.i); });
      g.appendChild(r);
      if (w > 44 && h > 20) {
        const t = document.createElementNS(svgNS, 'text');
        t.setAttribute('x', leaf.x0 + 6); t.setAttribute('y', leaf.y0 + 16); t.setAttribute('style', `fill:${d.own ? 'var(--ink)' : ink};font-size:12px;font-weight:600`);
        const maxc = Math.floor((w - 10) / 7); let name = d.own ? '(' + d.name + ')' : d.name; if (name.length > maxc) name = name.slice(0, Math.max(1, maxc - 1)) + '…';
        t.textContent = name; g.appendChild(t);
        if (h > 36) { const t2 = document.createElementNS(svgNS, 'text'); t2.setAttribute('x', leaf.x0 + 6); t2.setAttribute('y', leaf.y0 + 31); t2.setAttribute('style', `fill:${d.own ? 'var(--ink)' : ink};font-size:11px;opacity:0.85`); t2.textContent = fmtB(d.value); g.appendChild(t2); }
      }
      svg.appendChild(g);
    }
    el.innerHTML = ''; el.appendChild(svg);
    if (state.color === 'age') $('maplegend').innerHTML = `<span>Color shows the median age by bytes (${metricWord()}), using the age scale above.</span>`;
    else {
      const shown = [...new Set(root.leaves().map(l => state.owner !== null ? state.owner : topOwner(l.data.i)))].sort((a, b) => a - b);
      $('maplegend').innerHTML = '<span>Largest owner:</span>' + shown.map(u => `<span><i style="background:${ocol(u)}"></i>${esc(u < 8 ? uname(u) : 'other owners')}</span>`).filter((v, k, a) => a.indexOf(v) === k).join('');
    }
  }
  function nodeTipOwn(d) {
    const t = d.value;
    return `<div class="p">${esc(path(d.i))} (${esc(d.name)})</div><div class="row"><span>Disk used</span><b>${fmtB(t)}</b></div>
      <div class="row"><span>Not ${metricWord()} in ${oldWord()}</span><span>${pct(d.vec.slice(state.old).reduce((a, b) => a + b, 0), t)}</span></div>
      <div class="minibar" style="width:100%;margin-top:6px">${d.vec.map((x, j) => x > 0 ? `<div style="flex:${x};background:var(--a${j})"></div>` : '').join('')}</div>`;
  }

  function renderOwners() {
    const i = state.cur;
    const list = [...ownerAge[i].entries()].map(([u, v]) => ({ u, v: Array.from(v), t: v.reduce((a, b) => a + b, 0) })).filter(x => x.t > 0).sort((a, b) => b.t - a.t);
    const max = list.length ? list[0].t : 1, SHOW = 12;
    const rows = list.slice(0, SHOW);
    let html = rows.map(({ u, v, t }) => `<button class="orow${state.owner === u ? ' sel' : state.owner !== null ? ' dim' : ''}" data-u="${u}" aria-pressed="${state.owner === u}">
      <span class="nm"><i style="background:${ocol(u)}"></i>${esc(uname(u))}</span>
      <span class="stack" style="width:${Math.max(1, 100 * t / max)}%">${v.map((x, j) => x > 0 ? `<div style="flex:${x};background:var(--a${j})" data-j="${j}"></div>` : '').join('')}</span>
      <span class="vl">${fmtB(t)}</span></button>`).join('');
    if (list.length > SHOW) { const rest = list.slice(SHOW).reduce((a, b) => a + b.t, 0); html += `<div class="muted" style="font-size:12px;padding:4px">+ ${list.length - SHOW} more owners with ${fmtB(rest)} — choose them in the Owner menu</div>`; }
    $('owners').innerHTML = html || '<div class="empty">No data</div>';
    $('owners').querySelectorAll('.orow').forEach(b => {
      const u = +b.dataset.u, ent = list.find(x => x.u === u);
      b.onclick = () => { state.owner = state.owner === u ? null : u; compute(); render(); };
      b.onmousemove = ev => { const seg = ev.target.closest('[data-j]'); const j = seg ? +seg.dataset.j : null;
        showTip(ev, `<div class="p">${esc(uname(u))} in ${esc(path(i))}</div>` + ent.v.map((x, k) => x > 0 ? `<div class="row"${k === j ? ' style="font-weight:600"' : ''}><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--a${k});margin-right:6px"></i>${D.age_labels[k]}</span><span>${fmtB(x)}</span></div>` : '').join('')); };
      b.onmouseleave = hideTip;
    });
  }

  function renderAge() {
    const i = state.cur, v = ageVec(age, i), max = Math.max(...v, 1), t = total(i);
    $('age-title').textContent = `How old is it (last ${metricWord()})`;
    $('agecols').innerHTML = v.map((x, j) => `<div class="agecol" data-j="${j}"><span class="t">${x > 0 ? fmtB(x) : ''}</span><div class="b" style="height:${100 * x / max}%;background:var(--a${j})${j >= state.old ? ';outline:2px solid var(--warn);outline-offset:1px' : ''}"></div></div>`).join('');
    $('agelab').innerHTML = D.age_labels.map(l => `<span>${l}</span>`).join('');
    $('agecols').querySelectorAll('.agecol').forEach(c => { const j = +c.dataset.j;
      c.onmousemove = ev => showTip(ev, `<div class="p">${D.age_labels[j]} since last ${metricWord().replace('ed', '')}</div><div class="row"><span>Disk used</span><b>${fmtB(v[j])}</b></div><div class="row"><span>Share of folder</span><span>${pct(v[j], t)}</span></div>`);
      c.onmouseleave = hideTip; });
  }

  function renderKids() {
    const items = mapItems().filter(d => !d.own);
    const [key, dir] = state.sort;
    const val = d => key === 'name' ? d.name.toLowerCase() : key === 'files' ? files[d.i] : key === 'old' ? oldOf(age, d.i) / (d.value || 1) : key === 'newest' ? D.nodes[d.i][2] : d.value;
    items.sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
    const t = total(state.cur);
    const head = [['name', 'Folder', ''], ['size', 'Disk used', 'r'], ['', 'Share', 'r'], ['files', 'Files', 'r'], ['old', `Not ${metricWord()} in ${oldWord()}`, 'r'], ['', 'Age mix', ''], ['', 'Largest owner', ''], ['newest', 'Newest file', 'r']];
    $('kids').innerHTML = `<thead><tr>${head.map(([k, l, c]) => `<th class="${c}${k ? ' sortable' : ''}" ${k ? `data-k="${k}"` : ''}>${l}${k === key ? ` <span class="arrow">${dir < 0 ? '▼' : '▲'}</span>` : ''}</th>`).join('')}</tr></thead><tbody>` +
      (items.length ? items.map(d => { const o = topOwner(d.i), h = D.nodes[d.i][4];
        return `<tr class="click" data-i="${d.i}"><td class="mono">${esc(d.name)}${kids[d.i].length ? '/' : ''}${h ? ` <span class="flag" title="Entries whose size you cannot read">${fmtN(h)} hidden</span>` : ''}</td>
        <td class="r">${fmtB(d.value)}</td><td class="r">${pct(d.value, t)}</td><td class="r">${fmtN(files[d.i])}</td><td class="r">${pct(oldOf(age, d.i), d.value)}</td>
        <td><div class="minibar">${d.vec.map((x, j) => x > 0 ? `<div style="flex:${x};background:var(--a${j})"></div>` : '').join('')}</div></td>
        <td>${esc(uname(o))}</td><td class="r">${fmtD(D.nodes[d.i][2])}</td></tr>`; }).join('')
      : `<tr><td colspan="8" class="muted">${depth[state.cur] === maxDepth ? 'The scan does not break folders down below this depth. The largest files below are still listed.' : 'No subfolders with data.'}</td></tr>`) + '</tbody>';
    $('kids').querySelectorAll('th[data-k]').forEach(th => th.onclick = () => { const k = th.dataset.k; state.sort = state.sort[0] === k ? [k, -state.sort[1]] : [k, k === 'name' ? 1 : -1]; renderKids(); });
    $('kids').querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => go(+tr.dataset.i));
  }

  function renderFiles() {
    const p = path(state.cur) + '/';
    const list = D.top.filter(f => f[0].startsWith(p) && (state.owner === null || f[1] === state.owner));
    $('files-title').textContent = `Largest files in this folder${state.owner !== null ? ' owned by ' + uname(state.owner) : ''}`;
    const now = D.scan_time;
    $('files').innerHTML = `<thead><tr><th>Path</th><th class="r">Size on disk</th><th>Owner</th><th class="r">Modified</th><th class="r">Accessed</th></tr></thead><tbody>` +
      (list.length ? list.slice(0, state.nfiles).map(f => `<tr><td class="path">${esc(f[0].slice(p.length))}</td><td class="r">${fmtB(f[2])}</td><td>${esc(uname(f[1]))}</td><td class="r">${fmtD(f[3])}</td><td class="r">${fmtD(f[4])}</td></tr>`).join('')
        : `<tr><td colspan="5" class="muted">None of the ${fmtN(D.top.length)} largest files on the filesystem are here.</td></tr>`) + '</tbody>';
    $('files-more').hidden = list.length <= state.nfiles;
  }

  function renderBlind() {
    const p = path(state.cur), inP = d => d === p || d.startsWith(p + '/');
    const nx = D.noexec.filter(([d]) => inP(d)), ur = D.unreadable.filter(inP);
    const hid = nx.reduce((a, b) => a + b[1], 0);
    let html = `<p class="note">Folders you can list but not look inside. Their sizes are missing from every number on this page${fullScan ? ', and they make up most of the hatched gap in the filesystem bar' : ''}.</p>`;
    if (!nx.length && !ur.length) html += '<p class="note">None under this folder.</p>';
    if (nx.length) html += `<div class="tablewrap"><table><thead><tr><th>Folder (names visible, sizes hidden)</th><th class="r">Hidden entries</th></tr></thead><tbody>${nx.slice(0, 12).map(([d, n]) => `<tr><td class="path">${esc(d)}</td><td class="r">${fmtN(n)}</td></tr>`).join('')}</tbody></table></div>${nx.length > 12 ? `<p class="note">and ${nx.length - 12} more folders; ${fmtN(hid)} hidden entries in total.</p>` : ''}`;
    if (ur.length) html += `<div class="tablewrap"><table><thead><tr><th>Folders you cannot list at all</th></tr></thead><tbody>${ur.slice(0, 12).map(d => `<tr><td class="path">${esc(d)}</td></tr>`).join('')}</tbody></table></div>`;
    $('blind').innerHTML = html;
  }

  function renderYears() {
    const src = state.metric === 'a' ? D.ayears : D.myears, FIRST = 2000;
    const lastY = new Date(D.scan_time * 1000).getUTCFullYear();
    const ys = []; let early = 0;
    for (const [y, b] of Object.entries(src)) if (+y < FIRST) early += b;
    for (let y = FIRST; y <= lastY; y++) ys.push([String(y), src[y] || 0]);
    if (early) ys.unshift(['before ' + FIRST, early]);
    const max = Math.max(...ys.map(y => y[1]), 1), all = ys.reduce((a, b) => a + b[1], 0);
    $('years-title').textContent = `Whole filesystem by year last ${metricWord()}`;
    $('years').innerHTML = ys.map(([y, b], k) => `<div data-k="${k}" style="height:${100 * b / max}%"></div>`).join('');
    $('yearlab').innerHTML = `<span>${ys[0][0]}</span><span>${ys[Math.floor(ys.length / 2)][0]}</span><span>${ys[ys.length - 1][0]}</span>`;
    $('years').querySelectorAll('div').forEach(el => { const [y, b] = ys[+el.dataset.k];
      el.onmousemove = ev => showTip(ev, `<div class="p">${y}</div><div class="row"><span>Disk used</span><b>${fmtB(b)}</b></div><div class="row"><span>Share</span><span>${pct(b, all)}</span></div>`); el.onmouseleave = hideTip; });
    // Detect an access-time floor: almost nothing accessed before year Y although
    // plenty was modified before Y. That pattern means a copy or migration reset atime.
    const aTot = Object.values(D.ayears).reduce((a, b) => a + b, 0);
    const floorY = Object.keys(D.ayears).map(Number).sort((a, b) => a - b).find(y => D.ayears[y] / aTot >= 0.005);
    const modBefore = Object.entries(D.myears).filter(([y]) => +y < floorY).reduce((a, b) => a + b[1], 0);
    const reset = floorY && modBefore / aTot > 0.1;
    $('years-note').textContent = state.metric === 'a'
      ? (reset ? `Almost nothing has an access time before ${floorY}, yet ${fmtB(modBefore)} was last modified before then. Access times were probably reset by a copy, migration or scan around ${floorY}, so read "not accessed in N years" as a lower bound. Last modified is the safer measure of age.` : 'Access times are updated at most once a day (relatime).')
      : 'Last modified is when a file\'s contents last changed. Copies made with cp -p or rsync -a keep the original date.';
  }

  function render() {
    hideTip(); renderControls(); renderFs(); renderCrumbs(); renderTiles(); renderMap(); renderOwners(); renderAge(); renderKids(); renderFiles(); renderBlind(); renderYears();
  }

  compute(); render();
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderMap, 150); });
})();
</script>
